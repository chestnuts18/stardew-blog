# ================================================================
# THEME REDEFINE CONFIGURATION - 星露谷 Mod 分享博客
# 参考风格: blog.oksanye.com
# ================================================================

# BASIC INFORMATION >>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>
info:
  title: 草莓麻薯冰淇淋
  subtitle: 分享星露谷模组配置与优化
  author: 草莓麻薯冰淇淋
  url: https://kuriyu.love

# IMAGE CONFIGURATION >>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>
defaults:
  favicon: /images/网站图标.png
  logo:
  avatar: /images/头像.jpg

# COLORS >>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>
colors:
  primary: "#1DE9B6"
  secondary: "#FF6B6B"
  default_mode: light

# SITE CUSTOMIZATION >>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>
global:
  fonts:
    chinese:
      enable: true
      family: "Noto Sans SC"
      url: "https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@100..900&display=swap"
    english:
      enable: true
      family: "Noto Sans SC"
      url: "https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@100..900&display=swap"
    title:
      enable: true
      family: "ZCOOL XiaoWei"
      url: "https://fonts.googleapis.com/css2?family=ZCOOL+XiaoWei&display=swap"
  content_max_width: 1000px
  sidebar_width: 210px
  hover:
    shadow: true
    scale: true
  scroll_progress:
    bar: true
    percentage: true
  website_counter:
    url: https://cn.vercount.one/js
    enable: false
    site_pv: false
    site_uv: false
  single_page: true
  side_tools:
    gear_rotation: true
    auto_expand: false
  custom_cursor:
    enable: true
    default: /images/cursor/default.png
    pointer: /images/cursor/pointer.png
    text: /images/cursor/text.png
  open_graph:
    enable: true
    image: /images/og-image.jpg
    description: 分享星露谷模组配置、NexusMods尾号与优化参数

# FONTAWESOME >>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>
fontawesome:
  thin: false
  light: true
  duotone: true
  sharp_solid: false

# HOME BANNER >>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>
home_banner:
  enable: true
  style: fixed
  image:
    light: /images/封面.jpg
    dark: /images/封面.jpg
  title: " "
  subtitle:
    text: []
    hitokoto:
      enable: false
  text_color:
    light: "#003582"
    dark: "#FFFFFF"
  text_style:
    title_size: 3.0rem
    subtitle_size: 1.5rem
    line_height: 1.4
  custom_font:
    enable: true
    family: "ZCOOL XiaoWei"
    url: "https://fonts.googleapis.com/css2?family=ZCOOL+XiaoWei&display=swap"
  social_links:
    enable: false

# NAVIGATION BAR >>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>
navbar:
  auto_hide: false
  width:
    home: 1300px
    pages: 1200px
  links:
    主页:
      icon: fa-solid fa-home
      path: /
    标签:
      icon: fa-solid fa-tags
      path: /tags/
    归档:
      icon: fa-solid fa-timeline
      path: /archives/
    技术支持:
      icon: fa-solid fa-wrench
      path: /links/
    关于:
      icon: fa-solid fa-address-book
      path: /about/
    粉丝福利:
      icon: fa-solid fa-gift
      submenus:
        ⭐ 星守护礼物: /star-guardian/
        🎖️ 10级灯牌礼物: /badge-10/
        🏆 12级灯牌礼物: /badge-12/
  search:
    enable: true
    preload: true

# HOME PAGE ARTICLE SETTINGS >>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>
home:
  sidebar:
    enable: true
    position: left
    first_item: info
    announcement: ""
    show_on_mobile: false
    links:
      进一步了解我？:
        icon: fa-solid fa-address-card
        path: /about/
  article_date_format: auto
  excerpt_length: 200
  categories:
    enable: true
    limit: 3
  tags:
    enable: true
    limit: 3

# ARTICLE >>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>
articles:
  style:
    font_size: 16px
    line_height: 1.8
    image_border_radius: 14px
    image_alignment: center
    image_caption: true
    link_icon: true
    delete_mask: false
    title_alignment: left
    headings_top_spacing:
      h1: 2.4rem
      h2: 1.8rem
      h3: 1.4rem
      h4: 1.2rem
      h5: 1.1rem
      h6: 1.0rem
  word_count:
    enable: true
    count: true
    min2read: true
  author_label:
    enable: true
    auto: false
    list: ["Author"]
  code_block:
    copy: true
    style: mac
    highlight_theme:
      light: github
      dark: github-dark
  toc:
    enable: true
    max_depth: 4
    number: false
    expand: true
    init_open: true
  copyright:
    enable: true
    default: cc_by_nc_sa
  lazyload: true
  pangu_js: false
  recommendation:
    enable: false

# COMMENT >>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>
comment:
  enable: false
  system: waline

# FOOTER >>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>
footer:
  runtime: true
  icon: ''
  start: 2024/12/31 00:00:00
  statistics: false
  customize: '<div style="text-align:center;margin-bottom:6px">✨ 抖音星露谷美化主播 | 感谢陪伴 &nbsp;<img src="/images/kuri_celebrate.gif" style="width:22px;height:22px;vertical-align:middle;display:inline-block" alt="🎉"></div>'

# PLUGINS >>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>
plugins:
  feed:
    enable: false
  aplayer:
    enable: true
    type: fixed
    autoplay: true
    loop: all
    order: random
    audios:
      - name: "Bittersweet Chocolate"
        artist: "mr. hong"
        url: "/music/Bittersweet Chocolate.mp3"
        cover: "/images/preload/kuri_唱歌_2026-08-02-03-58-22.gif"
        theme: "#00473c"
        lrc: ""
  mermaid:
    enable: false
    version: "11.4.1"
    theme:
      light: "default"
      dark: "dark"

# PAGE TEMPLATES >>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>
page_templates:
  friends_column: 2
  tags_style: blur
  masonry:
    batch_size: 12
    initial_batch_size: 24

# CDN >>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>
cdn:
  enable: false
  provider: npmmirror

# INJECT >>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>
inject:
  enable: true
  head:
    - '<link rel="stylesheet" href="/css/preloader.css">'
    - '<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>'
    - '<script>if(!sessionStorage.getItem("pl")){document.write("\x3cdiv id=\"kuri-preloader\"><div class=\"emote-rain\" id=\"emote-rain\"></div><div class=\"overlay\"><span class=\"center-text\" id=\"pl-title\">草莓麻薯冰淇淋</span></div></div>");}</script>'
    - '<script>var _p=setInterval(function(){if(window.i18n&&window.i18n.runtime){window.i18n.runtime="🍓 草莓坚持营业";clearInterval(_p)}},10);function fixDom(){var w=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);var n;while(n=w.nextNode()){if(n.textContent.indexOf("博客已运行")!==-1)n.textContent=n.textContent.replace(/博客已运行/g,"🍓 草莓坚持营业");if(n.textContent.indexOf("访问人数")!==-1||n.textContent.indexOf("总访问量")!==-1)n.parentElement.style.display="none"}}document.addEventListener("DOMContentLoaded",fixDom);document.addEventListener("swup:willReplaceContent",function(){window.scrollTo(0,0)});document.addEventListener("swup:contentReplaced",function(){window.scrollTo(0,0);setTimeout(fixDom,100)})</script>'
  footer:
    - '<link rel="stylesheet" href="/css/custom.css">'
    - '<script>(function(){var c=window.theme&&window.theme.global&&window.theme.global.custom_cursor;if(!c||!c.enable)return;var s=document.createElement("style");s.textContent="*{cursor:url("+c.default+"),auto!important}a,button,[role=button],.nav-link,.links{cursor:url("+c.pointer+"),pointer!important}input,textarea,[contenteditable]{cursor:url("+c.text+"),text!important}";document.head.appendChild(s);document.addEventListener("swup:contentReplaced",function(){if(!document.head.contains(s))document.head.appendChild(s)})})()</script>'
    - '<script src="/js/preloader.js"></script>'
    - '<script>document.addEventListener("redefine:swup:ready",function(e){var p=e.detail.swup.plugins.find(function(x){return x.name==="SwupScrollPlugin"});if(p){p.options.animateScroll=false}})</script>'
    - '<script>(function(){var b=document.querySelector(".home-banner-background");if(!b)return;var m=window.innerWidth<768;var h=document.createElement("div");h.className="scroll-hint";h.innerHTML="<img src=\"/images/preload/kuri_打招呼2_2026-08-05-02-16-41.gif\" style=\"width:"+(m?90:140)+"px;height:"+(m?90:140)+"px;display:block;margin:0 auto 10px\"><span style=\"font-size:"+(m?"0.85rem":"1.1rem")+";color:#fff;font-family:ZCOOL XiaoWei,serif;text-shadow:0 2px 8px rgba(0,0,0,0.4)\">"+(m?"下滑":"鼠标滚轮下滑")+"看我的尾号分享~</span>";h.onclick=function(){window.scrollTo({top:window.innerHeight,behavior:"smooth"})};b.appendChild(h);h.style.transition="opacity 0.3s ease-out";window.addEventListener("scroll",function(){h.style.opacity=window.scrollY>80?"0":"1"},{passive:true})})()</script>'
