<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Custom Firework · 自定义烟花</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #E8D7F9; overflow: hidden; font-family: 'ZCOOL XiaoWei', 'Noto Sans SC', sans-serif; }
  #stage { position: fixed; top: 0; left: 0; width: 100%; height: 100%; }
  .particle {
    position: absolute;
    pointer-events: none;
    opacity: 0;
    animation: burstParticle 2.5s ease-out forwards;
  }
  @keyframes burstParticle {
    0%   { transform: translate(-50%,-50%) translate(0px,0px) rotate(0deg) scale(1); opacity: 1; }
    60%  { opacity: 0.8; }
    100% { transform: translate(-50%,-50%) translate(var(--dx),var(--dy)) rotate(var(--rot)) scale(0.4); opacity: 0; }
  }
  @font-face {
    font-family: 'MiaoFont';
    src: url('/fonts/miao.ttf');
  }
  .overlay { position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center; pointer-events: none; }
  .center-text { font-family: 'MiaoFont', sans-serif; font-size: 4rem; color: #5b2c8a;
    text-shadow: 0 0 12px rgba(200,160,255,0.5), 0 0 30px rgba(180,130,255,0.3);
  }
  .center-text .char {
    display: inline-block;
    font-family: inherit;
    animation: charBounce 0.9s cubic-bezier(0.18,0.89,0.32,1.28) forwards;
  }
  @keyframes charBounce {
    0%   { opacity: 0; transform: translateY(-120px) scale(0) rotate(-45deg); }
    50%  { opacity: 1; transform: translateY(15px) scale(1.4) rotate(10deg); }
    70%  { transform: translateY(-8px) scale(0.85) rotate(-5deg); }
    85%  { transform: translateY(4px) scale(1.06) rotate(2deg); }
    100% { opacity: 1; transform: translateY(0) scale(1) rotate(0deg); }
  }
  .label { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 20; background: rgba(255,255,255,0.8); padding: 6px 18px; border-radius: 20px; font-size: 0.85rem; color: #3a2060; }
  .controls { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 20; display: flex; gap: 12px; }
  .controls button, .controls a {
    background: rgba(255,255,255,0.85);
    border: 1px solid rgba(58,32,96,0.15);
    border-radius: 12px;
    padding: 10px 22px;
    font-size: 0.95rem;
    font-family: inherit;
    color: #3a2060;
    cursor: pointer;
    text-decoration: none;
    backdrop-filter: blur(8px);
    transition: transform 0.15s;
  }
  .controls button:hover, .controls a:hover { transform: scale(1.05); }
</style>
</head>
<body>
<div id="stage"></div>
<div class="overlay"><span class="center-text" id="title-text">草莓麻薯冰淇淋</span></div>
<div class="label">🎆 自定义 DOM 烟花 · GIF 能动能动！</div>
<div class="controls">
  <a href="/test/">← 返回</a>
  <button onclick="firework()">🎆 来一发</button>
  <button onclick="fireworkBig()">💥 大范围爆</button>
</div>

var emotes = [

  "kuri_通知_提示_硬币_2026-08-02-03-51-14.gif",
  "kuri_带薪拉屎简单模式_2026-08-02-03-56-57.gif"

function firework(cx, cy, count) {
  count = count || 50 + Math.floor(Math.random() * 30);

  for (var i = 0; i < count; i++) {
    var img = document.createElement('img');
    img.className = 'particle';
    img.src = encodeURI('/images/preload/' + emotes[Math.floor(Math.random() * emotes.length)]);
    var size = 45 + Math.random() * 70;
    img.style.width = size + 'px';
    img.style.height = size + 'px';
    img.style.left = cx + 'px';
    img.style.top = cy + 'px';

    var angle = (i / count) * Math.PI * 2 + (Math.random() - 0.5) * 0.2;
    var dist = 120 + Math.random() * 480;
    var dx = Math.cos(angle) * dist;
    var dy = Math.sin(angle) * dist - 20 - Math.random() * 40;
    var rot = (Math.random() - 0.5) * 360;
    var delay = Math.random() * 0.1;

    img.style.setProperty('--dx', dx + 'px');
    img.style.setProperty('--dy', dy + 'px');
    img.style.setProperty('--rot', rot + 'deg');
    img.style.animationDelay = delay + 's';
    img.style.animationDuration = (2 + Math.random() * 1.5) + 's';

    stage.appendChild(img);

    setTimeout(function() { img.remove(); }, 4000);
  }
}

function fireworkBig() {
  var cx = window.innerWidth * 0.5;
  var cy = window.innerHeight * 0.5;
  firework(cx, cy, 250);
}

// Split title into animated characters
(function() {
  var title = document.getElementById('title-text');
  var text = title.textContent;
  title.textContent = '';
  for (var i = 0; i < text.length; i++) {
    var span = document.createElement('span');
    span.className = 'char';
    span.textContent = text[i];
    span.style.animationDelay = (0.3 + i * 0.1) + 's';
    title.appendChild(span);
  }
})();

// Auto launch
setTimeout(function() { fireworkBig(); }, 400);
</script>
</body>
