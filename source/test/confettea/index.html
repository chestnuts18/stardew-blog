<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Confettea · 纸屑喷发式</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #E8D7F9; overflow: hidden; font-family: 'ZCOOL XiaoWei', 'Noto Sans SC', sans-serif; }
  .overlay { position: fixed; inset: 0; z-index: 2; display: flex; align-items: center; justify-content: center; pointer-events: none; }
  .center-text { font-size: 2.5rem; color: #3a2060; text-shadow: 0 0 30px rgba(232,215,249,0.9); }
  .controls { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 10; display: flex; gap: 12px; }
  .controls button, .controls a {
    background: rgba(255,255,255,0.85);
    border: 1px solid rgba(58,32,96,0.15);
    border-radius: 12px;
    padding: 10px 22px;
    font-size: 0.95rem;
    font-family: inherit;
    color: #3a2060;
    cursor: pointer;
    text-decoration: none;
    backdrop-filter: blur(8px);
    transition: transform 0.15s;
  }
  .controls button:hover, .controls a:hover { transform: scale(1.05); }
  .label { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 10; background: rgba(255,255,255,0.8); padding: 6px 18px; border-radius: 20px; font-size: 0.85rem; color: #3a2060; }
</style>
</head>
<body>
<div class="overlay"><span class="center-text">草莓麻薯冰淇淋</span></div>
<div class="label">🎊 Confettea · 纸屑喷发式</div>
<div class="controls">
  <a href="/test/">← 返回选择</a>
  <button onclick="doBurst()">🎆 再炸一次</button>
</div>
<script src="/js/confettea.js"></script>

// 自动发射
function doBurst() {
  confettea.default.burst({
    particleCount: 200,
    spread: 120,
    origin: { x: 0.5, y: 0.5 },
    images: kuriEmotes,
    shapes: ['square'],
    colors: [],
    ticks: 400,
    gravity: 0.6,
    decay: 0.94,
    startVelocity: 45,
  });
}

// 页面加载时自动来一发
setTimeout(doBurst, 500);
// 1.5秒后再补一发
setTimeout(doBurst, 1800);
